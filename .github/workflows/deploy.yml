name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 如果 Pages 还没启用，这一步会自动把发布源设成 GitHub Actions
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Lint docs
        run: |
          python3 scripts/lint_docs.py
          python3 scripts/lint_vue.py

      - name: Build
        run: npm run build
        env:
          # 项目站点部署在 /<repo>/ 下
          CTF_WIKI_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
